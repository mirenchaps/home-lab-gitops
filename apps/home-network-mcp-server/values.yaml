nameOverride: home-network-mcp-server

replicaCount: 1

image:
  tag: sha-7a8928c

command: ["/entrypoint.sh", "server"]

containerPort: 8001

service:
  nodePort: 30081

healthCheck:
  path: /health

metrics:
  enabled: true
  path: /metrics

dashboard:
  enabled: true

extraEnv:
  - name: HOMEBRIDGE_HOST
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: host
  - name: HOMEBRIDGE_USERNAME
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: username
  - name: HOMEBRIDGE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: password
