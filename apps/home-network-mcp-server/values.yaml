nameOverride: home-network-mcp-server

replicaCount: 1

image:
  tag: sha-8bd1957

command: ["/entrypoint.sh", "server"]

containerPort: 8001

service:
  nodePort: 30081

healthCheck:
  path: /health

# The MCP server's own tool-call metrics, added specifically so it can serve
# as a chaos target with a real steady-state baseline rather than only a
# static /health check.
metrics:
  enabled: true
  path: /metrics

extraEnv:
  - name: HOMEBRIDGE_HOST
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: host
  - name: HOMEBRIDGE_USERNAME
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: username
  - name: HOMEBRIDGE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: password
