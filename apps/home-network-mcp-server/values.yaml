nameOverride: home-network-mcp-server

replicaCount: 2

image:
  tag: sha-097a618

command: ["/entrypoint.sh", "server"]

containerPort: 8001

service:
  nodePort: 30081
  sessionAffinity: ClientIP

healthCheck:
  path: /health

metrics:
  enabled: true
  path: /metrics

dashboard:
  enabled: true

chaosExperiment:
  enabled: false
  targetPod: ""

extraEnv:
  - name: HOMEBRIDGE_HOST
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: host
  - name: HOMEBRIDGE_USERNAME
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: username
  - name: HOMEBRIDGE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homebridge-credentials
        key: password