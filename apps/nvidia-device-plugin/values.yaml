# The GPU node carries workload=ml:NoSchedule, so the DaemonSet needs the
# toleration to land there and the selector to stay off the control plane.
nodeSelector:
  workload: ml

tolerations:
  - key: workload
    operator: Equal
    value: ml
    effect: NoSchedule

# Selects the nvidia runtime k3s registered in containerd, without which the
# plugin cannot reach the driver.
runtimeClassName: nvidia

# The chart's default node affinity requires Node Feature Discovery labels that
# this cluster does not produce, so it excludes every node. An empty map will
# not clear it, because the template guards the block with `with` and skips
# falsy values, so it has to be overridden with a term that actually matches.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values:
                - ml
