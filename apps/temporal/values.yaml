server:
  image:
    tag: 1.31.2
  frontend:
    service:
      type: NodePort
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # numHistoryShards cannot be changed after the initial deployment.
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgres-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: postgres
            existingSecret: temporal-db-secret
            secretKey: password
            createDatabase: true
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: postgres
            existingSecret: temporal-db-secret
            secretKey: password
            createDatabase: true

admintools:
  image:
    tag: 1.31.2

web:
  image:
    tag: 2.52.0
  service:
    type: NodePort
