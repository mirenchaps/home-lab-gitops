apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-network-mcp-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/mirenchaps/home-lab-gitops.git
      targetRevision: main
      path: charts/home-network-mcp
      helm:
        valueFiles:
          - $values/apps/home-network-mcp-server/values.yaml
    - repoURL: https://github.com/mirenchaps/home-lab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true       # let ArgoCD delete resources removed from Git
      selfHeal: true    # let ArgoCD revert manual kubectl edits back to what Git says
