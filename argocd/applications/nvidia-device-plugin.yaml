apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nvidia.github.io/k8s-device-plugin
      chart: nvidia-device-plugin
      targetRevision: 0.20.0
      helm:
        valueFiles:
          - $values/apps/nvidia-device-plugin/values.yaml
    - repoURL: https://github.com/mirenchaps/home-lab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-device-plugin
  syncPolicy:
    automated:
      prune: true       # let ArgoCD delete resources removed from Git
      selfHeal: true    # let ArgoCD revert manual kubectl edits back to what Git says
    syncOptions:
      - CreateNamespace=true
