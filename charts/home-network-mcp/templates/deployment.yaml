apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nameOverride }}
  labels:
    app: {{ .Values.nameOverride }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.nameOverride }}
    spec:
      containers:
        - name: {{ .Values.nameOverride }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: WINRM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: winrm-credentials
                  key: username
            - name: WINRM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: winrm-credentials
                  key: password
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: pi-ssh-key
              mountPath: /app/id_ed25519
              subPath: id_ed25519
              readOnly: true
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: pi-ssh-key
          secret:
            secretName: pi-ssh-key
            defaultMode: 0600
        - name: config
          configMap:
            name: home-network-mcp-config
