{{- with .Values.chaosExperiment }}
{{- if .enabled }}
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: home-network-mcp-server-pod-kill
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: home-network-mcp-server
spec:
  action: pod-kill
  mode: one
  selector:
    pods:
      default:
        - {{ required "chaosExperiment.targetPod is required" .targetPod | quote }}
{{- end }}
{{- end }}