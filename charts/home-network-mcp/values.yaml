nameOverride: home-network-mcp

replicaCount: 3

image:
  repository: mirenchaps/home-network-mcp
  tag: sha-8bd1957

command: []

containerPort: 8000

service:
  nodePort: 30080

extraEnv: []

# Set per-app to enable readiness/liveness probes against a real endpoint.
healthCheck: {}

# Set per-app to opt into local Prometheus scraping (release: prometheus is
# required, this Prometheus only adopts ServiceMonitors carrying that label).
metrics:
  enabled: false

# Ships dashboards/*.json as a Grafana-sidecar ConfigMap. Only one app needs it,
# since the dashboard covers both Deployments.
dashboard:
  enabled: false
