kserve:
  controller:
    # Chart default is Knative, which would pull in Knative and Istio. "Standard"
    # is the current name for the mode formerly called RawDeployment.
    deploymentMode: Standard

    # No nodeSelector/tolerations here on purpose: the controller is a
    # reconciliation loop, not a GPU workload, and pinning it to the laptop node
    # would take KServe down whenever that node does.

# The storage initializer's memory limit is not settable here: the chart
# documents kserve.storage.resources but writes a hardcoded value into the
# inferenceservice-config ConfigMap. It is raised in patch-storage-initializer.yaml.
