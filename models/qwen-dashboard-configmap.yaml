apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-qwen-baseline
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  qwen-baseline.json: |
    {
      "title": "Qwen Baseline",
      "uid": "qwen-baseline",
      "schemaVersion": 39,
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "TTFT p95",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 TTFT",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Inter-token latency p95",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:inter_token_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 inter-token",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Generation throughput",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(vllm:generation_tokens_total[1m]))",
              "legendFormat": "tokens/sec",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "KV cache usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "vllm:kv_cache_usage_perc",
              "legendFormat": "KV cache",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Requests running vs waiting",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "vllm:num_requests_running",
              "legendFormat": "Running",
              "refId": "A"
            },
            {
              "expr": "vllm:num_requests_waiting",
              "legendFormat": "Waiting",
              "refId": "B"
            }
          ]
        }
      ]
    }
